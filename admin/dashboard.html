<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Vonari Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="admin-sidebar" data-active="dashboard.html"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Dashboard Overview</h1>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="admin-card" style="margin-bottom: 28px;">
      <h3 style="margin-bottom: 18px; font-size: 1.1rem;">Submissions by service</h3>
      <div id="service-breakdown"></div>
    </div>

    <div class="admin-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <h3 style="font-size: 1.1rem;">Recent inquiries</h3>
        <a href="inquiries.html" style="font-size:0.85rem; font-weight:600; color:var(--navy);">View all →</a>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>Name</th><th>Type</th><th>Service</th><th>Status</th><th>Date</th></tr>
        </thead>
        <tbody id="recent-table-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/admin-partials.js"></script>
<script src="../js/site.js"></script>
<script>
(async function () {
  const session = await adminGuard();
  if (!session) return;

  const { data: submissions, error } = await supabaseClient
    .from('submissions')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    document.querySelector('.admin-main').insertAdjacentHTML('afterbegin',
      '<div class="admin-card" style="border-color:var(--maroon); margin-bottom:24px;">Could not load submissions. Please refresh, or check your connection.</div>');
    return;
  }

  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
  const monthAgo = new Date(now); monthAgo.setDate(now.getDate() - 30);

  const thisWeek = submissions.filter(s => new Date(s.created_at) >= weekAgo).length;
  const thisMonth = submissions.filter(s => new Date(s.created_at) >= monthAgo).length;
  const newCount = submissions.filter(s => s.status === 'New').length;
  const inProgress = submissions.filter(s => s.status === 'In Progress').length;

  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-box"><span class="n">${thisWeek}</span><span class="l">Inquiries This Week</span></div>
    <div class="stat-box"><span class="n">${thisMonth}</span><span class="l">Inquiries This Month</span></div>
    <div class="stat-box"><span class="n">${newCount}</span><span class="l">Awaiting First Contact</span></div>
    <div class="stat-box"><span class="n">${inProgress}</span><span class="l">In Progress</span></div>
  `;

  const byService = {};
  submissions.forEach(s => { byService[s.service] = (byService[s.service] || 0) + 1; });
  const maxCount = Math.max(...Object.values(byService), 1);
  document.getElementById('service-breakdown').innerHTML = Object.entries(byService).length
    ? Object.entries(byService).map(([service, count]) => `
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:12px;">
      <span style="width:180px; font-size:0.88rem; color:var(--ink-soft); flex-shrink:0;">${service}</span>
      <div style="flex:1; background:var(--ivory); border-radius:3px; overflow:hidden; height:10px;">
        <div style="width:${(count/maxCount*100)}%; background:var(--gold); height:100%;"></div>
      </div>
      <span style="width:24px; text-align:right; font-weight:700; color:var(--navy); font-size:0.88rem;">${count}</span>
    </div>
  `).join('')
    : '<p style="font-size:0.88rem; color:var(--ink-soft);">No submissions yet.</p>';

  document.getElementById('recent-table-body').innerHTML = submissions.length
    ? submissions.slice(0, 6).map(s => `
    <tr onclick="window.location.href='inquiries.html'">
      <td><strong>${s.name}</strong></td>
      <td>${s.type}</td>
      <td>${s.service}</td>
      <td><span class="status-pill status-${s.status.replace(' ', '')}">${s.status}</span></td>
      <td>${new Date(s.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</td>
    </tr>
  `).join('')
    : '<tr><td colspan="5" style="text-align:center; color:var(--ink-soft); padding:24px;">No inquiries yet.</td></tr>';
})();
</script>
</body>
</html>
